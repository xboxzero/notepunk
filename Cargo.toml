[package]
name = "notepunk"
version = "0.1.0"
edition = "2021"
description = "NotePunk — beat-generation punk note capture"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Storage",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "Blob",
    "Url",
    "MediaDevices",
    "MediaRecorder",
    "MediaRecorderOptions",
    "MediaStream",
    "MediaStreamConstraints",
    "Navigator",
    "BlobEvent",
    "Event",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
