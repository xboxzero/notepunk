[package]
name = "notepunk"
version = "0.1.0"
edition = "2021"
description = "NotePunk — beat-generation punk note capture"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Storage",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "Blob",
    "Url",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
